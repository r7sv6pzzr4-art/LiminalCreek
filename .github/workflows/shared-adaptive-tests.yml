name: Shared adaptive isolated tests
on:
  push:
    branches: [shared-adaptive-integration-20261102]
    paths:
      - 'research/adaptive-engine.js'
      - 'research/coverage-audit.js'
      - 'research/freeze-stage.js'
      - 'research/append-only-promotion.js'
      - 'research/shared-study.test.js'
      - 'research/shared-coordinator.js'
      - 'research/shared-coordinator.test.js'
      - 'research/edge-engine-parity.test.mjs'
      - 'research/admin-ui-contract.test.js'
      - 'admin-adaptive.html'
      - 'admin-adaptive-config.js'
      - 'index.html'
      - 'participant-staging.html'
      - 'auth-staging.js'
      - 'research/staging/participant-progress.STAGING-ONLY.sql'
      - 'supabase/functions/liminal-auto-activate/index.ts'
      - 'supabase/functions/_shared/adaptive-engine.mjs'
      - '.github/workflows/shared-adaptive-tests.yml'
  workflow_dispatch:
jobs:
  test-shared:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/shared-study.test.js research/shared-coordinator.test.js research/coverage-audit.test.js research/freeze-stage.test.js research/promotion.test.js research/edge-engine-parity.test.mjs research/admin-ui-contract.test.js
