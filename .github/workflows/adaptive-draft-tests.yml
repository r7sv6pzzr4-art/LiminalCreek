name: Check inactive adaptive draft
on:
  push:
    branches:
      - adaptive-safe-draft-20261022
  workflow_dispatch:
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/adaptive.test.js
