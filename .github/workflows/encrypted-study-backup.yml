name: Encrypted daily study backup

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liminalcreek-daily-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.LIMINAL_BACKUP_DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.LIMINAL_BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" || -z "$AGE_RECIPIENT" ]]; then
            echo "::error::Missing database connection or age recipient secret."
            exit 1
          fi
          if [[ ! "$AGE_RECIPIENT" =~ ^age1[a-z0-9]{20,}$ ]]; then
            echo "::error::Invalid age recipient format."
            exit 1
          fi

      - name: Install file encryption utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Export private study database schema and data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/liminal-backup"
          cd "$RUNNER_TEMP/liminal-backup"
          # Read-only logical export of public tables, including all rows and
          # database-defined functions, RLS policies, constraints and indexes.
          # PostgreSQL 18 pg_dump works against supported older server versions.
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18 \
            sh -c 'exec pg_dump --dbname="$DATABASE_URL" --format=custom --schema=public --no-owner --no-privileges --file=/dev/stdout' \
            > study-public.dump
          test -s study-public.dump

      - name: Validate archive structure without printing data
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/liminal-backup"
          docker run --rm -v "$PWD:/backup:ro" postgres:18 \
            pg_restore --list /backup/study-public.dump > archive-toc.txt
          # Fail closed if either live study table or its data archive entry
          # is missing. No record content or response counts are printed.
          for table in studies participants assignments responses; do
            grep -Eq "TABLE public $table " archive-toc.txt
            grep -Eq "TABLE DATA public $table " archive-toc.txt
          done
          echo "Archive is readable; required study tables and data sections exist."
          rm -f archive-toc.txt

      - name: Encrypt and delete plaintext archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/liminal-backup"
          age -r "$AGE_RECIPIENT" -o study-public.dump.age study-public.dump
          test -s study-public.dump.age
          sha256sum study-public.dump.age > study-public.dump.age.sha256
          rm -f study-public.dump
          test ! -e study-public.dump
          echo "Encrypted archive created; plaintext removed."

      - name: Save encrypted recovery archive
        uses: actions/upload-artifact@v4
        with:
          name: liminal-study-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/liminal-backup/study-public.dump.age
            ${{ runner.temp }}/liminal-backup/study-public.dump.age.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report non-sensitive completion
        run: echo "Encrypted backup uploaded. Download and test a restore in a separate database before relying on recovery."
