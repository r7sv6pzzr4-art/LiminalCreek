# Local-only Supabase integration staging. This file contains NO remote project ID,
# access token, production database URL, or production credentials.
project_id = "liminalcreek-disposable-staging"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[functions.liminal-auto-activate]
verify_jwt = true
